name: ClassBridge Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build ClassBridge
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: classbridge-dist
          path: dist/
