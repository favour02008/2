workflows:
  classbridge-web:
    name: ClassBridge Web Build
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      node: 20

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Build ClassBridge
        script: npm run build

    artifacts:
      - dist/**

    publishing:
      email:
        recipients: []
